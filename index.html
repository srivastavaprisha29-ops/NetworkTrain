],[['ARP packet format','Hardware Type 1 means Ethernet. Protocol Type 0x0800 means IPv4. Address lengths are 6 and 4 bytes. Operation 1 is request and 2 is reply. Ethernet identifies ARP with EtherType 0x0806.'],['Where to resolve','Host to local host, host to gateway, router to next router, or final router to destination host. Every resolution applies to the outgoing local network.'],['Proxy ARP','A proxy router can answer for another IP using its own MAC, then forward traffic onward.']]);

canvas.onpointermove=e=>{

 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.axis&&Math.hypot(dx,dy)>5)drag.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
 const delta=drag.axis==='y'?dy:dx;
 place(drag.p+delta/Math.max(92,canvas.clientWidth*.24),true);
};
canvas.onlostpointercapture=()=>{drag=null;};
canvas.onpointerup=()=>{drag=null;};
canvas.onpointercancel=()=>{drag=null;};
function line(a,b,color,width=1){
 ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
}
function box(x,y,w,h,r,fill,stroke){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
}
function label(text,x,y,color='#92aecb',size=11,align='center'){
 ctx.textAlign=align;ctx.textBaseline='middle';ctx.font=size+'px monospace';ctx.fillStyle=color;ctx.fillText(text,x,y);
}
function token(x,y,text,color='#71b9ff',primary=false){
 ctx.font='12px monospace';const width=ctx.measureText(text).width+21;
 ctx.shadowBlur=primary?15:0;ctx.shadowColor='#2279d1';
 box(x-width/2,y-13,width,26,3,'#102a47',color);
 ctx.shadowBlur=0;label(text,x,y,'#e5f3ff',12);
 if(primary)packetLocation=[x,y];
}
function draw(){
 const w=canvas.clientWidth,h=canvas.clientHeight,dpr=devicePixelRatio||1;
 if(!w||!h)return;
 if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 const st=currentStep(),frac=position-index,mid=h*(w<620?.47:.49);
 const routed=mode==='journey'&&branch<5;
 const p=st.paths[0];
 const zoom=w<620?.79:1;
 const world=routed?rnodes:null;
 let xfocus=0;
 if(world&&p)xfocus=world[p.from][0]+(world[p.to][0]-world[p.from][0])*frac;
 const drift=Math.sin(position*.85)*Math.min(w*.12,120);
 const cam=xfocus*zoom-drift+position*8;
 ctx.fillStyle='#1a3554';
 for(let x=(36-cam*.26%36)%36;x<w;x+=36)for(let y=26;y<h;y+=36)ctx.fillRect(x,y,1,1);
 ctx.strokeStyle='#101c2c';ctx.lineWidth=1;
 for(let x=(144-cam*.51%144)%144;x<w;x+=144){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
 if(mode==='encap'){
  const x=w*.46,ytop=128,gap=Math.min(44,Math.max(22,(h-210)/7)),width=Math.min(w-34,270);
  [...layerNames].reverse().forEach((name,n)=>{
   const y=ytop+n*gap;
   box(x-width/2,y,width,gap-4,3,n===6-layer?'#153658':'#080f1a','#264566');
   label('L'+(7-n)+' '+name,x,y+(gap-4)/2);
  });
  const n=6-layer+(branch?-frac:frac)*.74;
  token(x+width/2-30,ytop+n*gap+gap/2,'PDU','#71b9ff',true);return;
 }
 if(routed){
  const offset=w*.4+drift-xfocus*zoom,pt=n=>[rnodes[n][0]*zoom+offset,mid+rnodes[n][1]*zoom];
  const left=pt('I')[0]-110*zoom,right=pt('O')[0]+110*zoom;
  box(left,mid-109,right-left,218,4,'#07111e','#284769');
  label('R1 / NETWORK PLANE',left+15,mid-91,'#77b2f6',11,'left');
  label('INGRESS',left+16,mid+88,'#587d9f',10,'left');
  label('EGRESS',right-16,mid+88,'#587d9f',10,'right');
  const chain=['A','I','V','F','H','N','M','O','R2','B'];
  chain.slice(1).forEach((n,i)=>line(pt(chain[i]),pt(n),'#28507a',2));
  [['V','Drop'],['M','Frag'],['Frag','O'],['M','ICMP']].forEach(([a,b])=>line(pt(a),pt(b),'#304763'));
  [['F','Routing table','DA → NA'],['N','ARP table','NA → MAC'],['M','MTU table','eth1 → 1280 B']].forEach(([n,name,detail])=>{
   const [x,y]=pt(n),dy=n==='M'?54:-57,sy=y+dy;
   line([x,y],[x,sy],'#395d82');
   box(x-59,sy-18,118,36,3,'#0a192b','#365779');
   label(name,x,sy-6,'#bcdaff',10);label(detail,x,sy+8,'#82a6c9',10);
  });
  st.paths.forEach(path=>line(pt(path.from),pt(path.to),'#64a8f4',2.5));
  for(const [n,value] of Object.entries(rnodes)){
   const [x,y]=pt(n),active=p&&(n===p.from||n===p.to);
   if(x<-170||x>w+170)continue;
   const host=['A','B','R2'].includes(n);
   if(host){
    ctx.beginPath();ctx.ellipse(x,y-13,26,13,0,0,Math.PI*2);
    ctx.fillStyle=active?'#164275':'#101f31';ctx.fill();ctx.strokeStyle='#659ad0';ctx.stroke();
    if(n==='R2'){line([x-12,y-17],[x+12,y-9],'#c4e4ff',2);line([x-12,y-9],[x+12,y-17],'#c4e4ff',2);}
    else label(n,x,y-13,'#d5e8ff');
    label(value[2],x,y+18,'#c6e0f8');label(value[3],x,y+34,'#7e9fbd',10);
   }else{
    box(x-72*zoom,y-20,144*zoom,40,4,active?'#102744':'#0b1828',active?'#75b8ff':'#3c5877');
    label(value[2],x,y-6,active?'#f0f8ff':'#a5c1da',w<620?9:11);
    label(value[3],x,y+8,'#7fa0bd',w<620?8:9);
   }
  }
  st.paths.forEach((path,i)=>{
   const a=pt(path.from),b=pt(path.to),t=Math.max(0,(frac-path.delay)/(1-path.delay));
   token(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t-31-i*29,path.label,path.color,i===0);
  });
  return;
 }
 const opt=current(),pt=n=>[nodes[n][0]*w,nodes[n][1]*h*.62+86];
 opt.links.forEach(([a,b])=>line(pt(a),pt(b),'#2c4966',2));
 st.paths.forEach(path=>line(pt(path.from),pt(path.to),path.color,2));
 opt.visible.forEach(n=>{
  const [x,y]=pt(n),active=st.paths.some(path=>path.from===n||path.to===n);
  box(x-21,y-15,42,30,3,active?'#123254':'#0b1725','#456789');
  label(n==='ALT'?'R3':n,x,y,'#c4e3ff');
  label(nodes[n][2],x,y+24);
  if(w>650)label(opt.aliases[n]??nodes[n][3],x,y+39,'#7b9dbf',9);
 });
 if(!p){token(w*.4,mid+45,'PDU','#71b9ff',true);return;}
 st.paths.forEach((path,i)=>{
  const a=pt(path.from),b=pt(path.to),t=Math.max(0,(frac-path.delay)/(1-path.delay));
  token(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t-28,path.label,path.color,i===0);
 });
}
new ResizeObserver(draw).observe(canvas);
choose('journey');

</script></body></html>
