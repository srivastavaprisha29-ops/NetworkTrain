 step('Host B passes the payload upward','The Ethernet frame is removed, IP recognizes its local destination, and the payload goes to transport.',[],[['Link layer','Checks and removes Ethernet framing.'],['Network layer','Uses IPv4 Protocol to hand the payload upward.']],[['Destination IP','203.0.113.20'],['TTL on arrival','62']],['Transport','Data'])
];

 step('Compare the destination with the local subnet','Host A and Host B are on 192.0.2.0/24. Host A resolves Host B’s MAC from Host B’s IP.',[],[['Next-hop IP','192.0.2.20']],[['Destination IP','192.0.2.20'],['Network prefix','192.0.2.0/24']],['IPv4','Transport','Data']),
 step('Send directly across the LAN','The IPv4 and Ethernet destination both identify Host B. There is no IP router on this path.',[send('A','B')],[['Direct delivery','A switch may forward the frame within the LAN.']],[['Source IP','192.0.2.10'],['Destination IP','192.0.2.20'],['Destination MAC','Host B'],['TTL','64']])
];

lab('journey','Packet journey','Follow an IPv4 datagram from sender to receiver and inspect the headers at each hop.',[
 option('Indirect delivery',tx),option('Direct delivery',direct,['A','B'],[['A','B']],{B:'192.0.2.20'})
],[
 ['Why IP and MAC differ','IP identifies the endpoints of this datagram. Ethernet MAC addresses identify the local sender and next hop and are rebuilt at each router.'],
 ['Source, router and destination','The source creates the datagram. Each router forwards it toward the destination. The receiving host removes the IP header and delivers the payload upward.']
]);
lab('encap','Encapsulation','Move down the sending stack or up the receiving stack and see which headers are present.',[
 ...['Sender ↓','Receiver ↑'].map((label,side)=>option(label,Array.from({length:7},(_,i)=>{const n=side?i:6-i; const [kind,down,up,headers]=layerData[n];return step(layerNames[n]+' · '+kind,side?up:down,[],[[side?'Decapsulation':'Encapsulation',side?'Pass the payload toward the application.':'Prepare data for the layer below.']],[['OSI layer',n+1],['Data unit',kind]],headers);}),['A','B'],[['A','B']]))
],[['Payload nesting','Transport adds its header to data. IP encloses the transport unit. Ethernet encloses that IP datagram, then the physical interface sends bits.']]);

 ['unicast','Unicast','192.0.2.20',['B'],'One addressed receiver gets the datagram.'],
 ['multi','Multicasting','224.0.0.9',['B','C'],'Group members B and C receive the update on the same LAN.'],
 ['broadcast','Broadcasting','255.255.255.255',['R1','B','C','D'],'All hosts on this local broadcast domain receive the frame.']
]){
 lab(id,title,description,[option('Local LAN',[
  step('Choose the destination',description,[],[['Destination','The address determines the delivery scope.']],[['Destination IPv4',dest]],['IPv4','Payload']),
  step('Transmit on the LAN',description,targets.map(n=>send('A',n,id==='multi'?'RIP v2':'IPv4')),targets.map(n=>[[n==='R1'?'Router ':'Host ']+n,'Receives the same transmission in this simulation window.']),[['Destination IPv4',dest],['Receivers',targets.join(', ')],['Ethernet destination',id==='broadcast'?'ff:ff:ff:ff:ff:ff':id==='multi'?'01:00:5e:00:00:09':'Host B MAC']],id==='multi'?['Ethernet','IPv4','UDP','RIP v2']:packet)
 ],lan,lanLinks,lanAlias)],[['Where it appears in the slides','RIPv1 uses broadcast for regular updates. RIPv2 can use multicast 224.0.0.9. ARP broadcasts at the Ethernet layer. A limited IP broadcast stays on the local network.']]);
}

 ...['Cache miss · gateway','Cache hit','Direct delivery'].map((label,i)=>{const target=i===2?'B':'R1';const ip=i===2?'192.0.2.20':'192.0.2.1';

 return option(label,[lookup,...(i===1?[]:[
 step('Broadcast the ARP request','Devices on this LAN see the request. Only the owner of the target IP replies in this example.',lan.slice(1).map(n=>send('A',n,'ARP request','#ffcc72')),[['Sender','Host A includes its own IP and MAC.'],['Receivers','Check the target protocol address in parallel.']],[['Operation','1 · Request'],['Sender IP','192.0.2.10'],['Sender MAC','Host A MAC'],['Target IP',ip],['Target hardware address','Unknown, shown as zeros'],['Ethernet destination','ff:ff:ff:ff:ff:ff']],['Ethernet','ARP','FCS']),
 step('Return the ARP reply','The target replies to Host A, which saves the mapping in its cache.',[send(target,'A','ARP reply','#65e1ed')],[['Cache','Install '+ip+' → '+target+' MAC.']],[['Operation','2 · Reply'],['Sender IP',ip],['Sender MAC',target+' MAC'],['Target IP','192.0.2.10'],['Ethernet destination','Host A MAC']],['Ethernet','ARP','FCS'])
 ]),step('Release the waiting datagram','Host A now has a MAC for the local next hop.',[send('A',target)],[['Frame destination',target+' MAC']],[['IPv4 destination',i===2?ip:'203.0.113.20'],['Ethernet destination',target+' MAC']])],lan,lanLinks,lanAlias);})
],[['ARP packet format','Hardware Type 1 means Ethernet. Protocol Type 0x0800 means IPv4. Address lengths are 6 and 4 bytes. Operation 1 is request and 2 is reply. Ethernet identifies ARP with EtherType 0x0806.'],['Where to resolve','Host to local host, host to gateway, router to next router, or final router to destination host. Every resolution applies to the outgoing local network.'],['Proxy ARP','A proxy router can answer for another IP using its own MAC, then forward traffic onward.']]);
const routes=[['203.0.113.128/26','R3','m2'],['203.0.113.128/25','R2','m1'],['0.0.0.0/0','R2','m1']];
const ipInt=ip=>ip.split('.').reduce((sum,part)=>sum*256+Number(part),0)>>>0;
const matches=(ip,cidr)=>{const [net,length]=cidr.split('/');return +length===0 || ipInt(ip)>>>(32-length)===ipInt(net)>>>(32-length);};
lab('forward','IP forwarding','Choose an address and compare every matching route. The longest matching prefix wins.',[
 ...['203.0.113.140','203.0.113.200','8.8.8.8'].map(ip=>{const results=routes.map(([prefix,via,port])=>({prefix,via,port,match:matches(ip,prefix)}));const best=results.find(route=>route.match);return option(ip,[
 step('Read the IPv4 destination','Each entry supplies its own prefix length. Apply its mask and compare the resulting network with that entry.',[send('A','R1')],results.map(r=>[r.prefix,r.match?'Match via '+r.via:'No match']),[['Destination IP',ip],...routes.map(([p,v,m])=>[p,v+' · '+m])]),

 ],['A','R1','R2','ALT'],[['A','R1'],['R1','R2'],['R1','ALT']]);})
],[['Forwarding entries','Network-specific entries represent a prefix. A host-specific entry uses /32. The default route /0 matches every IPv4 address and has the lowest specificity.'],['Classful examples','Without subnetting, class determines the default mask: A /8, B /16, C /24. With fixed-length subnetting, the local router can apply its known subnet mask. Classless forwarding stores a prefix length per entry.'],['Aggregation','Two contiguous, aligned /25 networks can be represented by one /24. A more specific exception still wins if both match.'],['Hierarchical routing','An ISP can advertise an aggregate externally and use more specific customer routes internally. The slides’ 120.14.64.0 block spans 16,384 addresses and can be divided into four /20 blocks.']]);

 step('Both packets arrive','Host B receives separate datagrams. Its transport protocol may handle ordering.',[send('R2','B','Packet 1'),send('ALT','B','Packet 2','#65e1ed')])
 ],['A','R1','R2','ALT','B'],[['A','R1'],['R1','R2'],['R2','B'],['R1','ALT'],['ALT','B']]),
 ...['Virtual circuit','Circuit switching'].map((label,i)=>option(label,[
 step('Set up the path','A setup request travels through the switches and a confirmation returns.',[send('A','R1','Setup'),send('R1','R2','Setup','#59a9ff',.32),send('R2','B','Setup','#59a9ff',.64)]),
 step('Confirm the path','The destination confirms that setup is complete.',[send('B','R2','Confirm'),send('R2','R1','Confirm','#59a9ff',.32),send('R1','A','Confirm','#59a9ff',.64)]),

 ]))

const routerNet=['R1','R2','ALT','B'];const routerLinks=[['R1','R2'],['R1','ALT'],['R2','B'],['ALT','B']];

 ...[1,2].map(i=>option('RIPv'+i,[

 step('Run Dijkstra on the link-state database','Each router computes paths from itself after installing topology information. In this separate topology, R1 settles R2 at 2 before R3 at 4.',[],[['Via R2','2 + 3 = 5'],['Via R3','4 + 4 = 8'],['Routing table','Choose R2 as the next hop.']],[['Shortest path','R1 → R2 → B'],['Total cost','5']],['Link-state database','Shortest path tree'])
 ],routerNet,routerLinks,{R1:'SPF root',R2:'Cost 2 from R1',ALT:'Cost 4 from R1',B:'Cost 3 via R2 / 4 via R3'}),

const $=id=>document.getElementById(id);
function make(tag,text,cls){
 const el=document.createElement(tag);
 if(text!==undefined)el.textContent=text;
 if(cls)el.className=cls;
 return el;
}
function button(text,action,selected,cls){
 const el=make('button',text,cls);
 el.onclick=action;
 if(selected!==undefined)el.setAttribute('aria-pressed',selected);
 return el;
}
const tabs=[['journey','Journey'],['encap','Encapsulation'],['unicast','Unicast'],['multi','Multicasting'],['broadcast','Broadcasting'],['arp','ARP'],['forward','Forwarding'],['switch','Switching'],['route','Routing']];
const sources=[
 'Network Layer 1 · Switching, delay examples, and network-layer services.',
 'Network Layer 3 · Delivery and Forwarding (PPTX): direct and indirect delivery, forwarding tables, CIDR, aggregation and ISP hierarchy.',
 'Network Layer 3 · Delivery and Forwarding (legacy PPT): related classful and classless forwarding material.',
 'Network Layer 5 · Routing Protocols: distance vector, RIP, link state, OSPF, path vector and BGP.',
 'Network Layer 5 · Routing Protocols (second copy): matching OSPF packet/LSA sequence, including the Router and Network LSA examples.',
 'Network Layer 6 · ARP: local versus remote next-hop resolution and request/reply behavior.'
];
sources.forEach(s=>$('source-list').append(make('li',s)));
$('sources').onclick=()=>$('source-dialog').showModal();
let mode='journey',branch=0,index=0,layer=2,playing=false,progress=0,last=0;
const current=()=>modes[mode].options[branch];
const currentStep=()=>current().steps[index];
function choose(id,choice=0,position=0){
 mode=id;branch=choice;layer=2;seek(position);renderNavigation();
}
function seek(position){
 index=Math.max(0,Math.min(position,current().steps.length-1));
 progress=0;
 playing=false;
 render();
}
function move(delta){
 seek(index+delta);
}
function connectStack(direction){
 choose('encap',direction,direction?layer:6-layer);
}
function renderNavigation(){
 $('toolbar').replaceChildren(...tabs.map(([id,label])=>button(label,()=>choose(id),id===mode)));
 $('layers').replaceChildren(...layerNames.map((name,n)=>{
  const el=button(undefined,()=>{
   if(n===2 && mode!=='encap'){choose('journey');return;}
   const side=mode==='encap'?branch:0;
   choose('encap',side,side?n:6-n);
  },layer===n,'layer');
  el.append(make('span','L'+(n+1)),document.createTextNode(name));
  return el;
 }).reverse());
}
function render(){
 if(mode==='encap')layer=branch?index:6-index;
 const selected=modes[mode], st=currentStep(), steps=current().steps;
 $('section').textContent=mode==='encap'?'OSI · Layer '+(layer+1):'Layer 3 · Network';
 $('title').textContent=selected.name;
 $('intro').textContent=selected.subtitle;
 $('branches').replaceChildren();
 if(selected.options.length>1){
  $('branches').append(make('span','Choose a path','label'),...selected.options.map((item,n)=>button(item.label,()=>choose(mode,n),n===branch)));
 }
 $('step-title').textContent=st.title;
 $('counter').textContent=(index+1)+' / '+steps.length;
 $('canvas').setAttribute('aria-label',st.paths.length?st.paths.map(p=>p.label+' from '+nodes[p.from][2]+' to '+nodes[p.to][2]).join('. '):st.description);
 $('scrub').max=steps.length-1;$('scrub').value=index;$('scrub').disabled=steps.length<2;
 $('prev').disabled=index===0;$('next').disabled=index===steps.length-1;
 $('play').textContent=playing?'Ⅱ Pause':'▶ Play';
 $('inspect-title').textContent=st.title;
 $('inspect-description').textContent=st.description;
 $('stack').replaceChildren(...st.stack.map(s=>make('span',s)));
 $('fields').replaceChildren(...st.fields.map(([key,value])=>{
  const row=make('div',undefined,'field');row.append(make('span',key),make('strong',value));return row;
 }));
 $('operations').replaceChildren(...st.operations.map(([title,detail])=>{
  const card=make('article',undefined,'card');card.append(make('h3',title),make('p',detail));return card;
 }));
 $('notes').replaceChildren(make('div','Slide notes','label'),...selected.notes.map(([title,detail])=>{
  const d=make('details');d.append(make('summary',title),make('p',detail));return d;
 }));
 renderNavigation();
 draw();
}
$('down').onclick=()=>connectStack(0);
$('up').onclick=()=>connectStack(1);
$('prev').onclick=()=>move(-1);
$('next').onclick=()=>move(1);
$('reset').onclick=()=>seek(0);
$('scrub').oninput=e=>seek(Number(e.target.value));
$('play').onclick=()=>{
 if(playing){playing=false;$('play').textContent='▶ Play';return;}
 if(index===current().steps.length-1&&progress>=1)seek(0);
 playing=true;$('play').textContent='Ⅱ Pause';
};
const canvas=$('canvas'),ctx=canvas.getContext('2d');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function segment(a,b,color,width){
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();
}
function box(x,y,w,h,r,fill,stroke){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
}
function label(text,x,y,color='#b9cbe2',font='12px system-ui'){
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.font=font;ctx.fillText(text,x,y);
}
function draw(){
 const w=canvas.clientWidth,h=canvas.clientHeight,dpr=devicePixelRatio||1;
 if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 ctx.fillStyle='#36516c';
 for(let x=13;x<w;x+=22)for(let y=14;y<h;y+=22)ctx.fillRect(x,y,1,1);
 if(mode==='encap'){
  const side=branch===0?'Sender':'Receiver';
  label(side+' stack',w*.5,16,'#7fc0ff','700 12px system-ui');
  [...layerNames].reverse().forEach((name,n)=>{
   const y=29+n*(h-37)/7,width=Math.min(w-30,300);
   box((w-width)/2,y,width,Math.max(20,(h-37)/7-4),5,6-n===layer?'#17478a':'#131f32',6-n===layer?'#65e1ed':'#2a405e');
   label((7-n)+'   '+name,w/2,y+(h-37)/14-2,6-n===layer?'#fff':'#a0b1c9');
  });
  return;
 }
 const selected=current(), st=currentStep(), positions={};
 selected.visible.forEach(id=>{positions[id]=[nodes[id][0]*w,nodes[id][1]*h];});
 selected.links.forEach(([from,to])=>segment(positions[from],positions[to],'#344968',2));
 st.paths.forEach(path=>segment(positions[path.from],positions[path.to],path.color,2));
 selected.visible.forEach(id=>{
  const [x,y]=positions[id],[, ,name,address]=nodes[id];
  const active=st.paths.some(path=>path.from===id||path.to===id);
  box(x-18,y-17,36,34,8,active?'#17478a':'#142236',active?'#65e1ed':'#486889');
  label(id==='ALT'?'R3':id,x,y,active?'#fff':'#bdcde3','700 12px system-ui');
  label(name,x,y+28,active?'#edf6ff':'#9ab0cc',w<490?'10px system-ui':'12px system-ui');
  const addressLabel=selected.aliases[id]??address;
  if(w>=490)label(addressLabel,x,y+44,'#7fa0c4','11px ui-monospace');
 });
 st.paths.forEach(path=>{
  const {from,to,color,delay}=path;
  const a=positions[from], b=positions[to];
  const p=reduced.matches?.5:Math.max(0,Math.min(1,(progress-delay)/Math.min(.72,1-delay)));
  const t=.19+.62*p;
  const x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;
  ctx.font='700 10px ui-monospace';const width=ctx.measureText(path.label).width+14;
  box(x-width/2,y-10,width,20,5,color);
  label(path.label,x,y,'#091224','700 10px ui-monospace');
 });
}
function tick(now){
 if(playing) {
  progress=Math.min(1,progress+Math.min(now-last,60)*Number($('speed').value)/2200);
  if(progress===1){
   if(index===current().steps.length-1){playing=false;$('play').textContent='▶ Play';}
   else {index+=1;progress=0;render();}
  }
  draw();
 }
 last=now;
 requestAnimationFrame(tick);
}
new ResizeObserver(draw).observe(canvas);
render();
requestAnimationFrame(tick);
</script></body></html>
