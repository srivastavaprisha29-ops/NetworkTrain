<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Follow a packet through the OSI model and experiment with network-layer protocols."><title>NetworkTrain — Packet Lab</title>
<link rel="stylesheet" href="./styles.css">
<script defer src="./labs.js"></script>
<script defer src="./lessons.js"></script>
<script defer src="./app.js"></script>
</head>
<body>
<header><div class="brand"><b>⇄</b>NetworkTrain</div><nav class="toolbar" aria-label="Concepts at this point" id="toolbar"></nav><button id="definitions-button">Definitions</button><button class="tools-end" id="sources">Slide coverage</button></header>
<div id="concept-pop" hidden></div><div id="rail"><div class="layout">
<aside><div class="label">OSI model</div><nav class="layers" aria-label="OSI layers" id="layers"></nav><div class="directions"><button id="down">↓ Sender stack</button><button id="up">↑ Receiver stack</button></div></aside>
<main><div class="overlay"><div class="label" id="section"></div><h1 id="title"></h1><p class="intro muted" id="intro"></p><div class="branches" id="branches"></div><div class="stage-heading"><h2 id="step-title"></h2><small class="live" id="counter"></small></div><nav id="stage-track" aria-label="Interactive packet stages" hidden></nav></div>
<section class="stage" aria-label="Packet simulator"><canvas id="canvas" role="img" aria-label="Network topology and active packet paths"></canvas><div id="hit-layer" aria-label="Interactive blocks on the packet path"></div>
<div class="controls"><button id="reset" title="Return to source">Reset</button><small>Drag the packet or scroll to travel</small><input id="scrub" type="range" min="0" value="0" aria-label="Packet position"><button id="router-map">Router map</button><button id="lab-menu">Labs &amp; notes</button></div></section>
<div class="cards" id="operations"></div></main>
<aside class="inspector" aria-label="Packet inspector"><div class="label">Packet inspector</div><h2 id="inspect-title"></h2><p id="inspect-description"></p><div class="stack" id="stack"></div><div class="fields" id="fields"></div><button id="inspect-more">Explain this stage</button></aside><aside id="lesson-drawer" aria-label="Concept lesson" hidden><div class="drawer-head"><div><div class="label" id="lesson-group"></div><h2 id="lesson-title"></h2></div><button id="lesson-close" aria-label="Close concept lesson">Close</button></div><div class="drawer-body" id="lesson-body"></div></aside>
</div></div>
<dialog id="definitions-dialog" aria-labelledby="definitions-title">
 <div class="glossary-head"><div class="dialog-top"><h2 id="definitions-title">Definitions &amp; keywords</h2><form method="dialog"><button>Close</button></form></div>
 <div class="glossary-filters"><input id="definition-search" type="search" aria-label="Search terms, abbreviations and descriptions" placeholder="Search e.g. DF, transit, or poison reverse"><select id="definition-group" aria-label="Definition topic"><option value="">All topics</option></select><button id="definition-context" aria-pressed="false">Current stage</button></div>
 <small id="def-status" aria-live="polite"></small></div><div id="definition-list"></div>
</dialog><dialog id="map-dialog"><div class="dialog-top"><h2 id="map-title">R1 · Router map</h2><form method="dialog"><button>Close</button></form></div><p class="muted" id="map-description">Follow the datagram from the incoming interface to the outgoing interface. Select a stage to jump there.</p><div id="map-stages"></div></dialog><dialog id="lab-dialog"><div class="dialog-top"><h2>Packet labs</h2><form method="dialog"><button>Close</button></form></div><div class="branches" id="lab-list"></div><h3>Concept library</h3><div id="lesson-index"></div><section class="notes" id="notes"></section></dialog>
<dialog id="source-dialog"><div class="dialog-top"><h2>Slide coverage</h2><form method="dialog"><button>Close</button></form></div><ul class="source-list" id="source-list"></ul></dialog>
</body></html>
